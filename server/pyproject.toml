[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behedr-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["behedr-common==0.1.0", "flask>=3.0.3,<4", "networkx>=3.3,<4", "scikit-learn>=1.5.1,<2", "numpy>=1.26.4,<3", "PyYAML>=6.0.1,<7", "PyJWT>=2.8,<3", "joblib>=1.4.2,<2", "requests>=2.32,<3", "psutil>=5.9.8,<8", "waitress>=3,<4"]

[project.scripts]
behedr-server = "behedr_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
behedr_server = ["templates/*.html"]
